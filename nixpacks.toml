# nixpacks.toml — Railway build configuration for WisLed Medusa v2 Backend
# Using Yarn Berry config to perfectly match the Dockerfile
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["corepack enable", "corepack prepare yarn@4.13.0 --activate"]

[phases.install]
cmds = ["yarn install --immutable"]

[phases.build]
cmds = ["yarn build", "cd .medusa/server && yarn install --immutable"]

[start]
# Run migrations then start — Medusa reads PORT from env (Railway injects it)
cmd = "cd .medusa/server && npx medusa db:migrate && npx medusa start"
